# Private server for the cross-process producer-binding test. It listens only on a socket the test
# names in a temporary directory it owns (PIPEWIRE_RUNTIME_DIR/PIPEWIRE_CORE set around creation).
# It never connects to the user's graph. Permissions are granted by the test's check_access handler.
context.properties = {
    core.daemon = true
    support.dbus = false
    link.max-buffers = 2
    log.level = 0
}
context.spa-libs = {
    support.* = support/libspa-support
    video.convert.* = videoconvert/libspa-videoconvert
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
]
